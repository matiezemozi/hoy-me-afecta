name: Actualizar datos HOY ME AFECTA
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Tests de validación
        run: python -m unittest discover -s backend/tests -v
      - name: Obtener fuentes y generar informe
        run: python backend/collector.py
      - name: Publicar JSON de prueba
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/feed.json
          git diff --cached --quiet || (git commit -m 'Actualizar feed de fuentes' && git push)
